# BRIHA nginx: HTTPS, static frontend, /api reverse proxy (SSE-friendly).
# Put the certificate files in deploy/certs/briha.crt and deploy/certs/briha.key (see deploy/README.md).

# Sign-in attempts per client IP: 10 right away, then 1 more every 6 seconds (about 10 a minute).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/briha.crt;
    ssl_certificate_key /etc/nginx/certs/briha.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers. nginx drops these in any location that has its own add_header,
    # so the locations below set caching with `expires` instead of add_header.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 64k;
    root /usr/share/nginx/html;

    # resolve the api container at request time, so nginx starts even if the api is still booting
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Too many sign-in attempts: answer in the same JSON shape the API uses.
    error_page 429 = @too_many_logins;
    location @too_many_logins {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many sign-in attempts. Please wait a minute and try again."}}';
    }

    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the real client, never a value the client sent
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/chat {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # stream SSE events immediately
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 30d;                  # file names change on every build
    }

    location / {
        try_files $uri /index.html;   # SPA routing
        expires -1;                   # always revalidate index.html
    }
}
