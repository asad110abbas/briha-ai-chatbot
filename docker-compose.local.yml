# Full BRIHA stack in Docker on THIS computer (for testing), opened at http://localhost:8080
#   cd frontend && npm run build && cd ..
#   docker compose -p briha -f docker-compose.local.yml up -d --build
# Only this computer can open it (port bound to 127.0.0.1). To test from a phone, change "127.0.0.1:8080:80" to "8080:80" for that test.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-briha}
      POSTGRES_USER: ${POSTGRES_USER:-briha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"   # for desktop DB tools (TablePlus/DBeaver/pgAdmin); this computer only
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      APP_BASE_URL: http://localhost:8080
    volumes:
      - ./data_apis.yaml:/data_apis.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # this computer only; use HTTPS (nginx.conf) for other people
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Database viewer in the browser: http://localhost:8081  (this computer only)
  #   System: PostgreSQL · Server: postgres · Username/Password/Database: POSTGRES_* from .env
  dbviewer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres

volumes:
  pgdata_local:
